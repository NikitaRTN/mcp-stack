[package]
name = "mcp-hub-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[dependencies]
base64 = "0.22"
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
url = "2"

[profile.release]
strip = true
