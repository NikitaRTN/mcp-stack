name: test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q hub run.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: node --check web/app.js
      - name: Windows MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $request = '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          $response = $request | powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows_mcp.ps1
          if (-not (($response | ConvertFrom-Json).result.tools.Count -ge 9)) { throw 'Windows MCP tools/list failed' }
