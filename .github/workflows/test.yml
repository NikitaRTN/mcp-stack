name: test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
        exclude:
          - os: ubuntu-latest
            python: '3.8'
        include:
          # setup-python does not provide Python 3.8 for Ubuntu 26.04.
          - os: ubuntu-24.04
            python: '3.8'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q hub run.py
      - name: Build Windows MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Build-WindowsMcp.ps1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          for file in web/js/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Windows MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $request = '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          $response = $request | & .\tools\windows_mcp.exe
          if (($response | ConvertFrom-Json).result.tools.Count -ne 16) { throw 'Windows MCP tools/list failed' }