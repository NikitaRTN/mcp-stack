name: test
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.8', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q hub run.py
      - name: Build Windows MCP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Build-WindowsMcp.ps1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          for file in web/js/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Windows MCP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $request = '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          $response = $request | & .\tools\windows_mcp.exe
          if (($response | ConvertFrom-Json).result.tools.Count -ne 16) { throw 'Windows MCP tools/list failed' }